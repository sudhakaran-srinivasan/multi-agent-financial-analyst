[build-system]                      # how to build/install the project
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [                    # needed to RUN the app
    "openai",
    "python-dotenv",
    "finnhub-python",
    "yfinance==1.7.0",              # pinned: unofficial scraper, behavior shifts between versions
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]            # needed only to DEVELOP/TEST (the "[dev]" part)

[tool.setuptools.packages.find]     # where the code lives
where = ["src"]

[tool.pytest.ini_options]           # lets pytest find tests
testpaths = ["tests"]